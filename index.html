  function renderTab(id, label, iconId) {
    const showBadge = id === "friends" && State.isBartender && State.pendingRequests.length > 0;
    return `
      <button class="tab-btn${State.activeTab === id ? " active" : ""}" data-tab="${id}">

  function renderSessionControls(session) {
    if (!State.isBartender) {
      return `<div style="text-align: center; font-size: 12px; color: var(--cream-dim); font-family: 'Cormorant Garamond', serif; font-style: italic; padding: 6px 0;">
        Viewing only — only the bartender can pour.

    }

        <button class="btn btn-danger" id="btn-end-session">${icon("stop")}Close bar</button>
      </div>
    `;

  function renderPourTab(session) {
    const tonightCounts = {};
    (session?.pours || []).forEach(p => { tonightCounts[p.friendId] = (tonightCounts[p.friendId] || 0) + 1; });

    // Spectator view (non-bartenders)
    if (!State.isBartender) {
      const ranked = State.barData.friends
        .map(f => ({ ...f, tonight: tonightCounts[f.id] || 0 }))
        .sort((a,b) => b.tonight - a.tonight);
      return `
        <div class="step-label">Tonight's tally</div>
        <div class="patron-grid">
          ${ranked.map(f => `
            <div class="patron-card" style="cursor: default;">
              ${monogram(f.name, "lg")}
              <div class="nm">${escapeHtml(f.name)}</div>
              <div class="ct">${f.tonight} tonight</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    // Step 1: pick a patron
    if (!State.selectedFriend) {
      return `
        <div class="step-label">Who's drinking?</div>
        <div class="patron-grid">
          ${State.barData.friends.map(f => `
            <button class="patron-card" data-friend="${f.id}">
              ${monogram(f.name, "lg")}
              <div class="nm">${escapeHtml(f.name)}</div>
              <div class="ct">${tonightCounts[f.id] || 0} tonight</div>
            </button>
          `).join("")}
        </div>
        ${State.barData.friends.length === 0 ? '<div class="empty-state">No patrons yet. Add some in the Patrons tab.</div>' : ''}
      `;
    }

    const friend = State.barData.friends.find(f => f.id === State.selectedFriend);
    if (!friend) { State.selectedFriend = null; return renderPourTab(session); }

    // Step 2: pick a drink category
    if (!State.pourCategory) {
      return `
        <button class="back-btn" id="btn-back-friends">${icon("back")}Back to patrons</button>
        <div class="friend-detail">
          ${monogram(friend.name, "xl", true)}
          <div class="nm">${escapeHtml(friend.name)}</div>
        </div>
        <div class="step-label">What are they having?</div>
        <div class="drink-type-grid">
          ${Object.entries(DRINK_CATEGORIES).map(([key, spec]) => `
            <button class="drink-type-btn" data-category="${key}">
              <div class="icon-big">${spec.icon}</div>
              <div class="lbl">${escapeHtml(spec.label)}</div>
              ${spec.deductsKeg ? '<div class="sub">From the taps</div>' : ''}
            </button>
          `).join("")}
        </div>
      `;
    }

    const catSpec = DRINK_CATEGORIES[State.pourCategory];

    // Step 3: if beer_tap and no size picked, pick size
    if (catSpec.needsSize && !State.pourSize) {
      return `
        <button class="back-btn" id="btn-back-category">${icon("back")}Back to drink type</button>
        <div class="friend-detail">
          ${monogram(friend.name, "xl", true)}
          <div class="nm">${escapeHtml(friend.name)}</div>
        </div>
        <div class="step-label">How much?</div>
        <div class="size-grid">
          <button class="size-btn half" data-size="half">
            <div class="glass-emoji">🍺</div>
            <div class="lbl">Half pint</div>
            <div class="sub">8 oz</div>
          </button>
          <button class="size-btn full" data-size="full">
            <div class="glass-emoji">🍺</div>
            <div class="lbl">Full pint</div>
            <div class="sub">16 oz</div>
          </button>
        </div>
      `;
    }

    // Step 4: if beer_tap, pick a keg. Otherwise, the pour happens immediately
    // (handled in the click handler for the drink-type button).
    if (catSpec.deductsKeg) {
      const requiredOz = State.pourSize === "half" ? HALF_POUR_OZ : POUR_OZ;
      return `
        <button class="back-btn" id="btn-back-size">${icon("back")}Back to size</button>
        <div class="friend-detail">
          ${monogram(friend.name, "xl", true)}
          <div class="nm">${escapeHtml(friend.name)}</div>
        </div>
        <div class="step-label">Pick a tap (${State.pourSize === "half" ? "half pint" : "full pint"})</div>
        <div>
          ${[...State.barData.kegs].sort((a,b) => a.tap - b.tap).map(keg => {
            const fullOz = KEG_SIZES[keg.size].oz;
            const pct = (keg.remainingOz / fullOz) * 100;
            const isEmpty = keg.remainingOz < requiredOz;
            return `
              <button class="keg-pour" ${isEmpty ? "disabled" : ""} data-keg="${keg.id}">
                <div class="tap-circle">${keg.tap}</div>
                <div class="info">
                  <div class="nm">${escapeHtml(keg.name)}</div>
                  <div class="meta">${escapeHtml(keg.brewery)} · ${escapeHtml(keg.style)}</div>
                  <div class="track"><div class="fill" style="width: ${pct}%;"></div></div>
                </div>
                <div class="right">
                  <div class="pct num">${Math.round(pct)}%</div>
                  ${isEmpty ? '<div class="empty-lbl">Empty</div>' : ''}
                </div>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    // Should never reach here — fall back
    return `<div class="step-label">Logging…</div>`;
  }

      `;

        const stats = computeFriendStats(f.id);

        const isBart = isPatronActivelyBartending(f.id);

        return `

        </div>
        <div class="form-actions three">
          <button class="btn btn-ghost" id="kf-cancel">Cancel</button>
          <button class="btn btn-ghost" id="kf-update">Update</button>
          <button class="btn btn-primary" id="kf-swap">Swap keg</button>
        </div>
      </div>
    `;
  }

  function renderHistoryTab() {
    const sortedSessions = [...State.barData.sessions].sort((a,b) => b.startedAt - a.startedAt);
    if (sortedSessions.length === 0) {
      return `<div class="empty-state">No sessions logged yet.</div>`;
    }
    return `
      <div>
        ${sortedSessions.map(sess => {
          const counts = {};
          sess.pours.forEach(p => { counts[p.friendId] = (counts[p.friendId] || 0) + 1; });
          const topFriends = Object.entries(counts)
            .map(([fid, c]) => ({ friend: State.barData.friends.find(f => f.id === fid), count: c }))
            .filter(x => x.friend).sort((a,b) => b.count - a.count).slice(0, 3);
          const duration = sess.endedAt ? Math.round((sess.endedAt - sess.startedAt) / 60000) : null;
          return `
            <div class="history-row">
              <div class="head">
                <div class="date">${fmtDate(sess.startedAt)} · ${fmtTime(sess.startedAt)}</div>
                ${!sess.endedAt ? '<div class="live-tag">Live</div>' : ''}
              </div>
              <div class="stats-line">${sess.pours.length} pints poured${duration !== null ? ` · ${Math.floor(duration / 60)}h ${duration % 60}m` : ''}</div>
              ${topFriends.length > 0 ? `
                <div class="chips">
                  ${topFriends.map(({friend, count}) => `<div class="friend-chip">${monogram(friend.name, "sm")}<span>${escapeHtml(friend.name.split(" ")[0])}</span><span class="num">${count}</span></div>`).join("")}
                </div>
              ` : ''}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function attachPhoneHandlers() {
    $("#btn-phone-exit")?.addEventListener("click", () => { State.role = null; render(); });
    document.querySelectorAll("[data-tab]").forEach(el => {
      el.addEventListener("click", () => {
        State.activeTab = el.dataset.tab;
        State.selectedFriend = null;
        State.editingFriendId = null;
        State.addingFriend = false;
        State.editingKegId = null;
        render();
      });
    });
    $("#btn-start-session")?.addEventListener("click", startSession);
    $("#btn-end-session")?.addEventListener("click", endSession);
    $("#btn-undo")?.addEventListener("click", undoLastPour);

    // Pour flow: patron → category → (size?) → keg (if beer_tap) → done
    document.querySelectorAll("[data-friend]").forEach(el => {
      el.addEventListener("click", () => {
        State.selectedFriend = el.dataset.friend;
        State.pourCategory = null;
        State.pourSize = null;
        render();
      });
    });
    $("#btn-back-friends")?.addEventListener("click", () => {
      State.selectedFriend = null;
      State.pourCategory = null;
      State.pourSize = null;
      render();
    });
    document.querySelectorAll("[data-category]").forEach(el => {
      el.addEventListener("click", async () => {
        const cat = el.dataset.category;
        const spec = DRINK_CATEGORIES[cat];
        State.pourCategory = cat;
        if (!spec.deductsKeg) {
          // Non-tap drinks log immediately
          await logPour(State.selectedFriend, { category: cat });
          State.selectedFriend = null;
          State.pourCategory = null;
          State.pourSize = null;
          render();
          return;
        }
        // beer_tap → continue to size picker
        render();
      });
    });
    $("#btn-back-category")?.addEventListener("click", () => {
      State.pourCategory = null;
      State.pourSize = null;
      render();
    });
    document.querySelectorAll("[data-size]").forEach(el => {
      el.addEventListener("click", () => {
        State.pourSize = el.dataset.size;
        render();
      });
    });
    $("#btn-back-size")?.addEventListener("click", () => {
      State.pourSize = null;
      render();
    });
    document.querySelectorAll("[data-keg]").forEach(el => {
      el.addEventListener("click", async () => {
        await logPour(State.selectedFriend, {
          category: State.pourCategory || "beer_tap",
          size: State.pourSize || "full",
          kegId: el.dataset.keg
        });
        State.selectedFriend = null;
        State.pourCategory = null;
        State.pourSize = null;
        render();
      });
    });

    $("#btn-add-friend")?.addEventListener("click", () => { State.addingFriend = true; render(); });
    document.querySelectorAll("[data-edit-friend]").forEach(el => {
      el.addEventListener("click", () => { State.editingFriendId = el.dataset.editFriend; render(); });
    });

    // Invite co-bartender
    $("#btn-invite-bartender")?.addEventListener("click", async () => {
      const btn = $("#btn-invite-bartender");
      btn.disabled = true;
      const inviteId = await createInvite();
      btn.disabled = false;
      if (!inviteId) return;
      const url = `${window.location.origin}/?join=${encodeURIComponent(State.barCode)}&invite=${encodeURIComponent(inviteId)}`;
      State.inviteModal = { inviteId, url, expiresAt: Date.now() + INVITE_EXPIRY_MS };
      render();
      // Render the QR inside the modal after render
      setTimeout(() => renderInviteQR(url), 0);
    });
    $("#btn-close-invite")?.addEventListener("click", () => {
      State.inviteModal = null;
      render();
    });
    $("#invite-backdrop")?.addEventListener("click", (e) => {
      if (e.target.id === "invite-backdrop") {
        State.inviteModal = null;
        render();
      }
    });
    // Re-render the QR if the modal is currently visible (after a render cycle)
    if (State.inviteModal) {
      setTimeout(() => renderInviteQR(State.inviteModal.url), 0);
    }

    // Pick-your-patron
    const patronSelect = $("#my-patron-select");
    const linkBtn = $("#btn-link-patron");
    if (patronSelect && linkBtn) {
      patronSelect.addEventListener("change", () => {
        linkBtn.disabled = !patronSelect.value;
      });
      linkBtn.addEventListener("click", async () => {
        const friendId = patronSelect.value;
        if (!friendId) return;
        linkBtn.disabled = true;
        await setMyPatronId(friendId);
        // Default to ON so the tag shows immediately
        await setMyActiveBartending(true);
        showToast("Tagged. You'll show as Bartender on the TV.", "success");
        render();
      });
    }

    // Active-bartender toggle
    $("#toggle-active-bartender")?.addEventListener("click", async () => {
      await setMyActiveBartending(!amIActivelyBartending());
    });

    // Pending request handlers
    document.querySelectorAll("[data-approve]").forEach(el => {
      el.addEventListener("click", async () => {
        const btn = el; btn.disabled = true;
        try { await approveRequest(el.dataset.approve); }
        catch (e) { console.error(e); showToast("Couldn't approve", "warn"); btn.disabled = false; }
      });
    });
    document.querySelectorAll("[data-reject]").forEach(el => {
      el.addEventListener("click", async () => {
        const btn = el; btn.disabled = true;
        try { await rejectRequest(el.dataset.reject); }
        catch (e) { console.error(e); showToast("Couldn't dismiss", "warn"); btn.disabled = false; }
      });
    });

    if (State.addingFriend || State.editingFriendId) {
      const nameInput = $("#ff-name");
      const preview = $("#ff-preview");
      nameInput?.addEventListener("input", () => {
        if (preview) preview.innerHTML = monogram(nameInput.value || "?", "lg");
      });
      $("#ff-cancel")?.addEventListener("click", () => {
        State.addingFriend = false; State.editingFriendId = null; render();
      });
      $("#ff-save")?.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        if (!name) { showToast("Enter a name", "warn"); return; }
        if (State.editingFriendId) await updateFriend(State.editingFriendId, { name });
        else await addFriend(name);
        State.addingFriend = false; State.editingFriendId = null; render();
      });
      $("#ff-delete")?.addEventListener("click", async () => {
        if (confirm("Delete this patron? Their stats will remain in past sessions.")) {
          await deleteFriend(State.editingFriendId);
          State.editingFriendId = null; render();
        }
      });
    }

    document.querySelectorAll("[data-edit-keg]").forEach(el => {
      el.addEventListener("click", () => { State.editingKegId = el.dataset.editKeg; render(); });
    });
    if (State.editingKegId) {
      $("#kf-cancel")?.addEventListener("click", () => { State.editingKegId = null; render(); });
      $("#kf-update")?.addEventListener("click", async () => {
        const data = {
          name: $("#kf-name").value.trim(),
          brewery: $("#kf-brewery").value.trim(),
          style: $("#kf-style").value.trim(),
          costCents: Math.round(parseFloat($("#kf-cost").value || "0") * 100)
        };
        await updateKeg(State.editingKegId, data);
        State.editingKegId = null; render();
      });
      $("#kf-swap")?.addEventListener("click", async () => {
        const data = {
          name: $("#kf-name").value.trim(),
          brewery: $("#kf-brewery").value.trim(),
          style: $("#kf-style").value.trim(),
          size: $("#kf-size").value,
          costCents: Math.round(parseFloat($("#kf-cost").value || "0") * 100)
        };
        await swapKeg(State.editingKegId, data);
        State.editingKegId = null; render();
      });
    }
  }

  // ========================================================
  // BOOT
  // ========================================================
  (async function boot() {
    if (!isConfigured) { render(); return; }
    const ok = await initFirebase();
    if (!ok) { $("#app").innerHTML = renderConfigWarning(); return; }

    // Check for invite-claim URL: ?join=<barCode>&invite=<inviteId>
    const params = new URLSearchParams(window.location.search);
    const joinBar = params.get("join");
    const joinInvite = params.get("invite");
    if (joinBar && joinInvite) {
      // Show a claim splash while we process
      $("#app").innerHTML = `
        <div class="app-bg grain splash">
          <div class="splash-inner">
            <div class="brand">
              <div class="eyebrow">Welcome to</div>
              <h1 class="serif">The Pool Bar</h1>
              <div class="tagline">Becoming a bartender…</div>
            </div>
            <div class="card" id="claim-status">
              <h2 class="serif">Just a moment</h2>
              <p class="sub" style="margin-bottom: 0;">Claiming your invite…</p>
            </div>
          </div>
        </div>
      `;
      const result = await claimInvite(joinBar.toUpperCase(), joinInvite);
      // Clean the URL so a refresh doesn't re-claim
      try { window.history.replaceState({}, "", window.location.pathname); } catch {}
      if (!result.ok) {
        $("#claim-status").innerHTML = `
          <h2 class="serif" style="color: var(--red);">Couldn't join</h2>
          <p class="sub">${escapeHtml(result.error)}</p>
          <button class="btn btn-primary" style="width: 100%; margin-top: 12px;" onclick="window.location.href = window.location.origin">Back to start</button>
        `;
        return;
      }
      // Success — subscribeBar was already called inside claimInvite
      showToast(result.alreadyBartender ? "You're already a bartender here" : "You're now a bartender. Welcome!", "success");
      // Wait for snapshot, render handles the rest
      return;
    }

    const savedCode = localStorage.getItem("taphouse_barCode");
    if (savedCode) {
      State.barCode = savedCode;
      try {
        const snap = await getDoc(doc(State.db, "bars", savedCode));
        if (snap.exists()) {
          subscribeBar();
          // If we arrived from a successful join, auto-select Spectator mode
          if (params.get("spectator") === "1") {
            State.role = "phone";
            try { window.history.replaceState({}, "", window.location.pathname); } catch {}
          }
          return;
        }
        else { localStorage.removeItem("taphouse_barCode"); State.barCode = null; }
      } catch (e) { console.warn("Couldn't resume saved bar:", e); }
    }
    render();
  })();
</script>
