  }

  function attachRoleSelectorHandlers() {
    document.querySelectorAll("[data-role]").forEach(el => {
      el.addEventListener("click", () => {
        State.role = el.dataset.role;
        if (State.role === "tv") startTVRotation();
        render();
      });
    });
    $("#btn-leave-bar")?.addEventListener("click", () => {
      if (State.unsubscribe) State.unsubscribe();
      if (State.requestsUnsubscribe) { State.requestsUnsubscribe(); State.requestsUnsubscribe = null; }
      State.pendingRequests = [];
      State.seenApprovals = new Set();
      localStorage.removeItem("taphouse_barCode");
      State.barCode = null; State.barData = null; State.role = null;
      render();
    });
  }

  // ====== TV ======
  function startTVRotation() {
    if (State.rotateInterval) clearInterval(State.rotateInterval);
    State.rotateInterval = setInterval(() => {
      State.viewIdx = (State.viewIdx + 1) % 4;
      render();
    }, ROTATE_MS);
  }

  function renderTV() {
    const views = ["leaderboard", "kegs", "achievements", "stats"];
    const session = State.barData.sessions.find(s => s.id === State.barData.currentSessionId);
    let content = "";
    if (views[State.viewIdx] === "leaderboard") content = renderTVLeaderboard(session);
    else if (views[State.viewIdx] === "kegs") content = renderTVKegs();
    else if (views[State.viewIdx] === "achievements") content = renderTVAchievements();
    else if (views[State.viewIdx] === "stats") content = renderTVStats(session);

    const pendingCount = State.pendingRequests.length;
    const pendingBanner = pendingCount > 0
      ? `<div class="tv-pending-banner">
          <div class="text"><span class="count">${pendingCount}</span> ${pendingCount === 1 ? "patron is" : "patrons are"} waiting at the door</div>
          <div class="hint">Bartender approves on phone</div>
        </div>`
      : "";

    return `
      <div class="app-bg grain tv-shell">
        <div class="tv-header">
          <div class="tv-brand">
            <h1 class="serif">The Pool Bar</h1>
            <div class="tv-status ${session ? "live" : ""}"><span class="dot"></span>${session ? "Session in progress" : "Tavern at rest"}</div>
          </div>
          <div class="pagination">
            ${views.map((_, i) => `<div class="page-dot${i === State.viewIdx ? " active" : ""}"></div>`).join("")}
          </div>
          <button class="icon-btn" id="btn-tv-exit">${icon("x")}</button>
        </div>
        ${pendingBanner}
        <div class="tv-content">${content}</div>
        <div class="qr-corner" id="tv-qr">
          <div class="qr-img" id="tv-qr-img"></div>
          <div class="qr-label">Scan to join the bar</div>
          <div class="qr-sub">${escapeHtml(State.barCode || "")}</div>
        </div>
      </div>
    `;
  }
  function attachTVHandlers() {
    $("#btn-tv-exit")?.addEventListener("click", () => {
      if (State.rotateInterval) clearInterval(State.rotateInterval);
      State.role = null;
      render();
    });
    // Render the QR code for the join URL
    renderQRCode();
  }

  function renderQRCode() {
    const container = $("#tv-qr-img");
    if (!container || !State.barCode) return;
    // Build the join URL — same origin, /join.html with the bar code
    const joinUrl = `${window.location.origin}/join.html?bar=${encodeURIComponent(State.barCode)}`;
    container.innerHTML = ""; // Clear previous
    if (typeof QRCode !== "undefined" && QRCode.toCanvas) {
      const canvas = document.createElement("canvas");
      container.appendChild(canvas);
      QRCode.toCanvas(canvas, joinUrl, {
        width: 110,
        margin: 1,
        color: { dark: "#1a0e07", light: "#ede2cc" }
      }, (err) => { if (err) console.warn("QR render error:", err); });
    } else {
      // Fallback: show the URL as text
      container.innerHTML = `<div style="font-size: 9px; color: #1a0e07; padding: 6px;">${escapeHtml(joinUrl)}</div>`;
    }
  }

  function tvHeading(eyebrow, title, sub) {
    return `
      <div class="tv-heading">
        <div class="eyebrow">${escapeHtml(eyebrow)}</div>
        <h2 class="serif">${escapeHtml(title)}</h2>
        ${sub ? `<div class="sub">${escapeHtml(sub)}</div>` : ""}
      </div>
    `;
  }

  function renderTVLeaderboard(session) {
    const tonightCounts = {};
    (session?.pours || []).forEach(p => { tonightCounts[p.friendId] = (tonightCounts[p.friendId] || 0) + 1; });
    const lifetimeCounts = {};
    State.barData.sessions.forEach(s => s.pours.forEach(p => { lifetimeCounts[p.friendId] = (lifetimeCounts[p.friendId] || 0) + 1; }));
    const ranked = State.barData.friends
      .map(f => ({ ...f, tonight: tonightCounts[f.id] || 0, lifetime: lifetimeCounts[f.id] || 0 }))
      .sort((a, b) => b.tonight - a.tonight || b.lifetime - a.lifetime);
    const maxTonight = Math.max(...ranked.map(r => r.tonight), 1);

    return `
      <div style="animation: slideUp 0.5s;">
        ${tvHeading("Tonight", "At the bar", "Ranking of the regulars")}
        <div class="leaderboard">
          ${ranked.map((f, i) => {
            const widthPct = (f.tonight / maxTonight) * 100;
            const isLeader = i === 0 && f.tonight > 0;
            return `
              <div class="lb-row${isLeader ? " leader" : ""}" style="animation: slideUp 0.4s ${i * 0.06}s both;">
                <div class="lb-rank num">${i + 1}</div>
                ${monogram(f.name, "lg", isLeader)}
                <div>
                  <div class="lb-name">${escapeHtml(f.name)}</div>
                  <div class="lb-bar-track"><div class="lb-bar-fill" style="width: ${widthPct}%; animation-delay: ${i * 0.08}s;"></div></div>
                </div>
                <div class="lb-num-block">
                  <div class="value num">${f.tonight}</div>
                  <div class="label">Tonight</div>
                </div>
                <div class="lb-lifetime">
                  <div class="value num">${f.lifetime}</div>
                  <div class="label">Lifetime</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  function renderTVKegs() {
    return `
      <div style="animation: slideUp 0.5s;">
        ${tvHeading("On Tap", "What's flowing", "Tonight's selection")}
        <div class="keg-grid">
          ${[...State.barData.kegs].sort((a,b) => a.tap - b.tap).map((keg, i) => {
            const fullOz = KEG_SIZES[keg.size].oz;
            const pct = Math.max(0, (keg.remainingOz / fullOz) * 100);
            const isLow = pct < 15 && keg.remainingOz >= POUR_OZ;
            const isEmpty = keg.remainingOz < POUR_OZ;
            return `
              <div class="keg-card${isEmpty ? " empty" : isLow ? " low" : ""}" style="animation: slideUp 0.5s ${i * 0.08}s both;">
                <div class="keg-head">
                  <div class="tap-num">Tap ${keg.tap}</div>
                  ${isEmpty ? '<div class="keg-pill empty">Empty</div>' : isLow ? '<div class="keg-pill low">Running low</div>' : ''}
                </div>
                <div class="keg-name serif">${escapeHtml(keg.name)}</div>
                <div class="keg-meta">${escapeHtml(keg.brewery)} · ${escapeHtml(keg.style)}</div>
                <div class="keg-visual"><div class="fill" style="height: ${pct}%;"></div></div>
                <div class="keg-stats">
                  <span class="num">${Math.round(keg.remainingOz)} oz remaining</span>
                  <span class="pct num">${Math.round(pct)}%</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  function renderTVAchievements() {
    const allEarned = [];
    State.barData.friends.forEach(f => {
      getEarnedAchievements(f.id).forEach(achId => {
        const ach = ACHIEVEMENTS.find(a => a.id === achId);
        if (ach) allEarned.push({ friend: f, ach });
      });
    });
    return `
      <div style="animation: slideUp 0.5s;">
        ${tvHeading("Hall of Fame", "Honours bestowed", "Earned through the long evenings")}
        ${allEarned.length === 0
          ? `<div class="empty-state">No honours yet — the night is young.</div>`
          : `<div class="ach-grid">
              ${allEarned.slice(0, 9).map((item, i) => `
                <div class="ach-card" style="animation: slideUp 0.4s ${i * 0.05}s both;">
                  <div class="ach-icon">${item.ach.icon}</div>
                  <div class="ach-info">
                    <div class="ach-name">${escapeHtml(item.ach.name)}</div>
                    <div class="ach-desc">${escapeHtml(item.ach.desc)}</div>
                    <div class="ach-who">${monogram(item.friend.name, "sm")}${escapeHtml(item.friend.name)}</div>
                  </div>
                </div>
              `).join("")}
            </div>`
        }
      </div>
    `;
  }

  function renderTVStats(session) {
    const totalTonight = (session?.pours || []).length;
    const totalLifetime = State.barData.sessions.reduce((sum, s) => sum + s.pours.length, 0);
    const totalSessions = State.barData.sessions.length;
    const oncePer = totalSessions > 0 ? (totalLifetime / totalSessions).toFixed(1) : "0";
    const tapCounts = {};
    State.barData.sessions.forEach(s => s.pours.forEach(p => { tapCounts[p.kegId] = (tapCounts[p.kegId] || 0) + 1; }));
    const popularKegs = State.barData.kegs.map(k => ({ ...k, count: tapCounts[k.id] || 0 })).sort((a,b) => b.count - a.count);
    const totalSpent = State.barData.kegs.reduce((sum, k) => sum + k.costCents, 0);
    const totalCapacityOz = State.barData.kegs.reduce((sum, k) => sum + KEG_SIZES[k.size].oz, 0);
    const totalPouredOz = State.barData.kegs.reduce((sum, k) => sum + (KEG_SIZES[k.size].oz - k.remainingOz), 0);
    const costPerOz = totalCapacityOz > 0 ? totalSpent / totalCapacityOz : 0;
    const costSoFar = totalPouredOz * costPerOz;

    return `
      <div style="animation: slideUp 0.5s;">
        ${tvHeading("The Ledger", "Numbers from the till", "An accounting")}
        <div class="stat-grid">
          ${bigStat("Tonight", totalTonight, "pints poured")}
          ${bigStat("All-time", totalLifetime, "pints poured")}
          ${bigStat("Sessions", totalSessions, "parties hosted")}
          ${bigStat("Average", oncePer, "pints per session")}
        </div>
        <div class="stat-pair">
          <div class="panel">
            <h3>Most popular tap</h3>
            ${popularKegs.slice(0, 4).map(k => {
              const max = popularKegs[0].count || 1;
              return `
                <div class="pop-row">
                  <div class="head"><span class="nm">Tap ${k.tap} · ${escapeHtml(k.name)}</span><span class="ct num">${k.count}</span></div>
                  <div class="track"><div class="fill" style="width: ${(k.count / max) * 100}%;"></div></div>
                </div>
              `;
            }).join("")}
          </div>
          <div class="panel">
            <h3>The bill</h3>
            <div class="ledger">
              <div class="ledger-row"><span class="l">Invested in kegs</span><span class="v num">${fmtMoney(totalSpent)}</span></div>
              <div class="ledger-row"><span class="l">Poured so far</span><span class="v num">${fmtMoney(costSoFar)}</span></div>
              <div class="ledger-row"><span class="l">Still in the kegs</span><span class="v num">${fmtMoney(totalSpent - costSoFar)}</span></div>
              <div class="ledger-row total"><span class="l">Cost per pint</span><span class="v num">${fmtMoney(Math.round(costPerOz * POUR_OZ * 100))}</span></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }
  function bigStat(label, value, sub) {
    return `<div class="stat-block">
      <div class="label">${escapeHtml(label)}</div>
      <div class="value num">${value}</div>
      <div class="sub">${escapeHtml(sub)}</div>
    </div>`;
  }

  function showNowPouring(pour) {
    const friend = State.barData.friends.find(f => f.id === pour.friendId);
    const keg = State.barData.kegs.find(k => k.id === pour.kegId);
    if (!friend || !keg) return;
    const existing = document.querySelector(".pouring-overlay");
    if (existing) existing.remove();
    const overlay = document.createElement("div");
    overlay.className = "pouring-overlay";
    overlay.innerHTML = `
      <div class="pouring-card${pour.kegKill ? ' kill' : ''}">
        ${pour.kegKill ? '<div class="slayer-tag">Keg Slayer</div>' : ''}
        <div class="mono-wrap">${monogram(friend.name, "xxl", true)}</div>
        <div class="eyebrow">Now Pouring</div>
        <div class="name">${escapeHtml(friend.name)}</div>
        <div class="pour-line">a pint of ${escapeHtml(keg.name)}</div>
      </div>
    `;
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 4500);
  }

  // Reads the H1 from the TV header so the welcome message stays in sync with title changes
  function getBarName() {
    // Default fallback if not yet rendered
    return document.querySelector(".tv-brand h1")?.textContent || "The Pool Bar";
  }

  function showWelcomeOverlay(friend) {
    const existing = document.querySelector(".welcome-overlay");
    if (existing) existing.remove();
    // Pause TV rotation while welcome is displayed
    if (State.rotateInterval) { clearInterval(State.rotateInterval); State.rotateInterval = null; }
    const overlay = document.createElement("div");
    overlay.className = "welcome-overlay";
    overlay.innerHTML = `
      <div class="welcome-card">
        <div class="welcome-eyebrow">A new patron arrives</div>
        <div class="welcome-mono-wrap">${monogram(friend.name, "xxl", true)}</div>
        <div class="welcome-headline serif">Welcome to ${escapeHtml(getBarName())}</div>
        <div class="welcome-name serif">${escapeHtml(friend.name)}</div>
        <div class="welcome-flourish">Sláinte. Make yourself at home.</div>
      </div>
    `;
    document.body.appendChild(overlay);
    setTimeout(() => {
      overlay.remove();
      // Resume TV rotation
      if (State.role === "tv" && !State.rotateInterval) startTVRotation();
    }, 6000);
  }

  // ====== PHONE ======
  function renderPhone() {
    const session = State.barData.sessions.find(s => s.id === State.barData.currentSessionId);
    let body = "";
    if (State.activeTab === "pour") body = renderPourTab(session);
    else if (State.activeTab === "friends") body = renderFriendsTab();
    else if (State.activeTab === "kegs") body = renderKegsTab();
    else if (State.activeTab === "history") body = renderHistoryTab();

    return `
      <div class="app-bg grain phone-wrap">
        <div class="phone-header">
          <div class="top">
            <div style="min-width: 0;">
              <h1>${State.isBartender ? "Barkeep's Book" : "The Snug"}</h1>
              <div class="status ${session ? "live" : ""}"><span class="dot"></span>${session ? "Active session" : "No session"}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="role-badge ${State.isBartender ? "bartender" : "viewer"}">${State.isBartender ? "Bartender" : "Viewer"}</span>
              <button class="icon-btn" id="btn-phone-exit">${icon("x")}</button>
            </div>
          </div>
          <div class="session-controls">${renderSessionControls(session)}</div>
        </div>
        <div class="tabs">
          ${renderTab("pour", "Pour", "beer")}
          ${renderTab("friends", "Patrons", "users")}
          ${renderTab("kegs", "Kegs", "droplet")}
          ${renderTab("history", "Log", "history")}
        </div>
        <div class="tab-content">${body}</div>
      </div>
    `;
  }
  function renderTab(id, label, iconId) {
    const showBadge = id === "friends" && State.isBartender && State.pendingRequests.length > 0;
    return `
      <button class="tab-btn${State.activeTab === id ? " active" : ""}" data-tab="${id}">
        ${icon(iconId)}
        <span class="lbl">${label}</span>
        ${showBadge ? '<span class="badge"></span>' : ''}
      </button>
    `;
  }
  function renderSessionControls(session) {
    if (!State.isBartender) {
      return `<div style="text-align: center; font-size: 12px; color: var(--cream-dim); font-family: 'Cormorant Garamond', serif; font-style: italic; padding: 6px 0;">
        Viewing only — only the bartender can pour.
      </div>`;
    }
    if (!session) {
      return `<button class="btn btn-primary" id="btn-start-session" style="width: 100%;">${icon("play")}Open the bar</button>`;
    }
    return `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="btn btn-ghost" id="btn-undo" ${session.pours.length === 0 ? "disabled" : ""}>${icon("undo")}Undo</button>
        <button class="btn btn-danger" id="btn-end-session">${icon("stop")}Close bar</button>
      </div>
    `;
  }

  function renderPourTab(session) {
    const tonightCounts = {};
    (session?.pours || []).forEach(p => { tonightCounts[p.friendId] = (tonightCounts[p.friendId] || 0) + 1; });

    if (!State.isBartender) {
      const ranked = State.barData.friends
        .map(f => ({ ...f, tonight: tonightCounts[f.id] || 0 }))
        .sort((a,b) => b.tonight - a.tonight);
      return `
        <div class="step-label">Tonight's tally</div>
        <div class="patron-grid">
          ${ranked.map(f => `
            <div class="patron-card" style="cursor: default;">
              ${monogram(f.name, "lg")}
              <div class="nm">${escapeHtml(f.name)}</div>
              <div class="ct">${f.tonight} tonight</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    if (!State.selectedFriend) {
      return `
        <div class="step-label">Who's drinking?</div>
        <div class="patron-grid">
          ${State.barData.friends.map(f => `
            <button class="patron-card" data-friend="${f.id}">
              ${monogram(f.name, "lg")}
              <div class="nm">${escapeHtml(f.name)}</div>
              <div class="ct">${tonightCounts[f.id] || 0} tonight</div>
            </button>
          `).join("")}
        </div>
        ${State.barData.friends.length === 0 ? '<div class="empty-state">No patrons yet. Add some in the Patrons tab.</div>' : ''}
      `;
    }

    const friend = State.barData.friends.find(f => f.id === State.selectedFriend);
    if (!friend) { State.selectedFriend = null; return renderPourTab(session); }
    return `
      <button class="back-btn" id="btn-back-friends">${icon("back")}Back to patrons</button>
      <div class="friend-detail">
        ${monogram(friend.name, "xl", true)}
        <div class="nm">${escapeHtml(friend.name)}</div>
      </div>
      <div class="step-label">Pick a tap</div>
      <div>
        ${[...State.barData.kegs].sort((a,b) => a.tap - b.tap).map(keg => {
          const fullOz = KEG_SIZES[keg.size].oz;
          const pct = (keg.remainingOz / fullOz) * 100;
          const isEmpty = keg.remainingOz < POUR_OZ;
          return `
            <button class="keg-pour" ${isEmpty ? "disabled" : ""} data-keg="${keg.id}">
              <div class="tap-circle">${keg.tap}</div>
              <div class="info">
                <div class="nm">${escapeHtml(keg.name)}</div>
                <div class="meta">${escapeHtml(keg.brewery)} · ${escapeHtml(keg.style)}</div>
                <div class="track"><div class="fill" style="width: ${pct}%;"></div></div>
              </div>
              <div class="right">
                <div class="pct num">${Math.round(pct)}%</div>
                ${isEmpty ? '<div class="empty-lbl">Empty</div>' : ''}
              </div>
            </button>
          `;
        }).join("")}
      </div>
    `;
  }

  function renderFriendsTab() {
    if (!State.isBartender) {
      return `
        <div>
          ${State.barData.friends.map(f => {
            const stats = computeFriendStats(f.id);
            const earned = getEarnedAchievements(f.id);
            return `
              <div class="friend-row">
                ${monogram(f.name, "md")}
                <div class="info">
                  <div class="nm">${escapeHtml(f.name)}</div>
                  <div class="meta">${stats.lifetime} lifetime · ${stats.sessionsAttended} sessions · ${earned.length} honours</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }
    if (State.addingFriend || State.editingFriendId) {
      const target = State.editingFriendId ? State.barData.friends.find(f => f.id === State.editingFriendId) : null;
      return renderFriendForm(target);
    }
    return `
      ${renderPendingRequestsSection()}
      <button class="btn btn-primary" id="btn-add-friend" style="width: 100%; margin-bottom: 16px;">${icon("plus")}Add patron</button>
      ${State.barData.friends.map(f => {
        const stats = computeFriendStats(f.id);
        const earned = getEarnedAchievements(f.id);
        return `
          <div class="friend-row">
            ${monogram(f.name, "md")}
            <div class="info">
              <div class="nm">${escapeHtml(f.name)}</div>
              <div class="meta">${stats.lifetime} lifetime · ${stats.sessionsAttended} sessions · ${earned.length} honours</div>
            </div>
            <button class="icon-btn" data-edit-friend="${f.id}">${icon("edit")}</button>
          </div>
        `;
      }).join("")}
    `;
  }

  function renderPendingRequestsSection() {
    if (!State.isBartender || State.pendingRequests.length === 0) return "";
    return `
      <div class="pending-section">
        <div class="pending-header">
          <div class="label">At the door</div>
          <div class="count">${State.pendingRequests.length} ${State.pendingRequests.length === 1 ? "request" : "requests"}</div>
        </div>
        ${State.pendingRequests.map(r => {
          const mins = Math.floor((Date.now() - (r.createdAt || 0)) / 60000);
          const ago = mins < 1 ? "just now" : `${mins} min ago`;
          return `
            <div class="pending-row">
              ${monogram(r.name, "md")}
              <div class="info">
                <div class="nm">${escapeHtml(r.name)}</div>
                <div class="ago">${ago}</div>
              </div>
              <div class="actions">
                <button class="btn-mini reject" data-reject="${r.id}">Dismiss</button>
                <button class="btn-mini approve" data-approve="${r.id}">Welcome in</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }
  function renderFriendForm(target) {
    const name = target?.name || "";
    return `
      <div class="form-page">
        <h2 class="serif">${target ? "Edit patron" : "New patron"}</h2>
        <div class="field">
          <label>Name</label>
          <input type="text" id="ff-name" value="${escapeHtml(name)}" placeholder="Enter their name" />
        </div>
        <div class="field">
          <label>Monogram preview</label>
          <div class="mono-picker">
            <div class="preview-wrap">
              <div id="ff-preview">${monogram(name || "?", "lg")}</div>
            </div>
            <div class="preview-note">Initials are taken from the first and last name.</div>
          </div>
        </div>
        <div class="form-actions ${target ? "three" : "two"}">
          <button class="btn btn-ghost" id="ff-cancel">Cancel</button>
          ${target ? `<button class="btn btn-danger" id="ff-delete">${icon("trash")}Delete</button>` : ""}
          <button class="btn btn-primary" id="ff-save">Save</button>
        </div>
      </div>
    `;
  }

  function renderKegsTab() {
    if (!State.isBartender) {
      return `
        <div>
          ${[...State.barData.kegs].sort((a,b) => a.tap - b.tap).map(keg => {
            const fullOz = KEG_SIZES[keg.size].oz;
            const pct = (keg.remainingOz / fullOz) * 100;
            return `
              <div class="keg-edit">
                <div class="head">
                  <div class="tap-circle" style="width: 36px; height: 36px; border-radius: 50%; background: var(--gold-soft); color: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 15px;">${keg.tap}</div>
                  <div class="info">
                    <div class="nm">${escapeHtml(keg.name)}</div>
                    <div class="meta">${escapeHtml(keg.brewery)} · ${escapeHtml(keg.style)} · ${KEG_SIZES[keg.size].name}</div>
                  </div>
                </div>
                <div class="level-track"><div class="level-fill" style="width: ${pct}%;"></div></div>
                <div class="stats">
                  <span class="num">${Math.round(keg.remainingOz)} of ${fullOz} oz</span>
                  <span class="pct num">${Math.round(pct)}% · ${fmtMoney(keg.costCents)}</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }
    if (State.editingKegId) {
      const keg = State.barData.kegs.find(k => k.id === State.editingKegId);
      if (!keg) { State.editingKegId = null; return renderKegsTab(); }
      return renderKegForm(keg);
    }
    return `
      <div>
        ${[...State.barData.kegs].sort((a,b) => a.tap - b.tap).map(keg => {
          const fullOz = KEG_SIZES[keg.size].oz;
          const pct = (keg.remainingOz / fullOz) * 100;
          return `
            <div class="keg-edit">
              <div class="head">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--gold-soft); color: var(--bg-deep); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 15px; flex-shrink: 0;">${keg.tap}</div>
                <div class="info">
                  <div class="nm">${escapeHtml(keg.name)}</div>
                  <div class="meta">${escapeHtml(keg.brewery)} · ${escapeHtml(keg.style)} · ${KEG_SIZES[keg.size].name}</div>
                </div>
                <button class="icon-btn" data-edit-keg="${keg.id}">${icon("edit")}</button>
              </div>
              <div class="level-track"><div class="level-fill" style="width: ${pct}%;"></div></div>
              <div class="stats">
                <span class="num">${Math.round(keg.remainingOz)} of ${fullOz} oz</span>
                <span class="pct num">${Math.round(pct)}% · ${fmtMoney(keg.costCents)}</span>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }
  function renderKegForm(keg) {
    return `
      <div class="form-page">
        <h2 class="serif">Tap ${keg.tap}</h2>
        <div class="field"><label>Beer name</label><input type="text" id="kf-name" value="${escapeHtml(keg.name)}" /></div>
        <div class="field"><label>Brewery</label><input type="text" id="kf-brewery" value="${escapeHtml(keg.brewery)}" /></div>
        <div class="field"><label>Style</label><input type="text" id="kf-style" value="${escapeHtml(keg.style)}" /></div>
        <div class="field"><label>Keg size</label>
          <select id="kf-size">
            ${Object.entries(KEG_SIZES).map(([k,v]) => `<option value="${k}"${k === keg.size ? " selected" : ""}>${v.name}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Cost ($)</label><input type="number" step="0.01" id="kf-cost" value="${(keg.costCents / 100).toFixed(2)}" /></div>
        <div class="info-note">
          <strong>Swap</strong> resets the keg to full at the new size. <strong>Update</strong> changes the information only.
        </div>
        <div class="form-actions three">
          <button class="btn btn-ghost" id="kf-cancel">Cancel</button>
          <button class="btn btn-ghost" id="kf-update">Update</button>
          <button class="btn btn-primary" id="kf-swap">Swap keg</button>
        </div>
      </div>
    `;
  }

  function renderHistoryTab() {
    const sortedSessions = [...State.barData.sessions].sort((a,b) => b.startedAt - a.startedAt);
    if (sortedSessions.length === 0) {
      return `<div class="empty-state">No sessions logged yet.</div>`;
    }
    return `
      <div>
        ${sortedSessions.map(sess => {
          const counts = {};
          sess.pours.forEach(p => { counts[p.friendId] = (counts[p.friendId] || 0) + 1; });
          const topFriends = Object.entries(counts)
            .map(([fid, c]) => ({ friend: State.barData.friends.find(f => f.id === fid), count: c }))
            .filter(x => x.friend).sort((a,b) => b.count - a.count).slice(0, 3);
          const duration = sess.endedAt ? Math.round((sess.endedAt - sess.startedAt) / 60000) : null;
          return `
            <div class="history-row">
              <div class="head">
                <div class="date">${fmtDate(sess.startedAt)} · ${fmtTime(sess.startedAt)}</div>
                ${!sess.endedAt ? '<div class="live-tag">Live</div>' : ''}
              </div>
              <div class="stats-line">${sess.pours.length} pints poured${duration !== null ? ` · ${Math.floor(duration / 60)}h ${duration % 60}m` : ''}</div>
              ${topFriends.length > 0 ? `
                <div class="chips">
                  ${topFriends.map(({friend, count}) => `<div class="friend-chip">${monogram(friend.name, "sm")}<span>${escapeHtml(friend.name.split(" ")[0])}</span><span class="num">${count}</span></div>`).join("")}
                </div>
              ` : ''}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function attachPhoneHandlers() {
    $("#btn-phone-exit")?.addEventListener("click", () => { State.role = null; render(); });
    document.querySelectorAll("[data-tab]").forEach(el => {
      el.addEventListener("click", () => {
        State.activeTab = el.dataset.tab;
        State.selectedFriend = null;
        State.editingFriendId = null;
        State.addingFriend = false;
        State.editingKegId = null;
        render();
      });
    });
    $("#btn-start-session")?.addEventListener("click", startSession);
    $("#btn-end-session")?.addEventListener("click", endSession);
    $("#btn-undo")?.addEventListener("click", undoLastPour);

    document.querySelectorAll("[data-friend]").forEach(el => {
      el.addEventListener("click", () => { State.selectedFriend = el.dataset.friend; render(); });
    });
    $("#btn-back-friends")?.addEventListener("click", () => { State.selectedFriend = null; render(); });
    document.querySelectorAll("[data-keg]").forEach(el => {
      el.addEventListener("click", async () => {
        await logPour(State.selectedFriend, el.dataset.keg);
        State.selectedFriend = null;
        render();
      });
    });

    $("#btn-add-friend")?.addEventListener("click", () => { State.addingFriend = true; render(); });
    document.querySelectorAll("[data-edit-friend]").forEach(el => {
      el.addEventListener("click", () => { State.editingFriendId = el.dataset.editFriend; render(); });
    });

    // Pending request handlers
    document.querySelectorAll("[data-approve]").forEach(el => {
      el.addEventListener("click", async () => {
        const btn = el; btn.disabled = true;
        try { await approveRequest(el.dataset.approve); }
        catch (e) { console.error(e); showToast("Couldn't approve", "warn"); btn.disabled = false; }
      });
    });
    document.querySelectorAll("[data-reject]").forEach(el => {
      el.addEventListener("click", async () => {
        const btn = el; btn.disabled = true;
        try { await rejectRequest(el.dataset.reject); }
        catch (e) { console.error(e); showToast("Couldn't dismiss", "warn"); btn.disabled = false; }
      });
    });

    if (State.addingFriend || State.editingFriendId) {
      const nameInput = $("#ff-name");
      const preview = $("#ff-preview");
      nameInput?.addEventListener("input", () => {
        if (preview) preview.innerHTML = monogram(nameInput.value || "?", "lg");
      });
      $("#ff-cancel")?.addEventListener("click", () => {
        State.addingFriend = false; State.editingFriendId = null; render();
      });
      $("#ff-save")?.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        if (!name) { showToast("Enter a name", "warn"); return; }
        if (State.editingFriendId) await updateFriend(State.editingFriendId, { name });
        else await addFriend(name);
        State.addingFriend = false; State.editingFriendId = null; render();
      });
      $("#ff-delete")?.addEventListener("click", async () => {
        if (confirm("Delete this patron? Their stats will remain in past sessions.")) {
          await deleteFriend(State.editingFriendId);
          State.editingFriendId = null; render();
        }
      });
    }

    document.querySelectorAll("[data-edit-keg]").forEach(el => {
      el.addEventListener("click", () => { State.editingKegId = el.dataset.editKeg; render(); });
    });
    if (State.editingKegId) {
      $("#kf-cancel")?.addEventListener("click", () => { State.editingKegId = null; render(); });
      $("#kf-update")?.addEventListener("click", async () => {
        const data = {
          name: $("#kf-name").value.trim(),
          brewery: $("#kf-brewery").value.trim(),
          style: $("#kf-style").value.trim(),
          costCents: Math.round(parseFloat($("#kf-cost").value || "0") * 100)
        };
        await updateKeg(State.editingKegId, data);
        State.editingKegId = null; render();
      });
      $("#kf-swap")?.addEventListener("click", async () => {
        const data = {
          name: $("#kf-name").value.trim(),
          brewery: $("#kf-brewery").value.trim(),
          style: $("#kf-style").value.trim(),
          size: $("#kf-size").value,
          costCents: Math.round(parseFloat($("#kf-cost").value || "0") * 100)
        };
        await swapKeg(State.editingKegId, data);
        State.editingKegId = null; render();
      });
    }
  }

  // ========================================================
  // BOOT
  // ========================================================
  (async function boot() {
    if (!isConfigured) { render(); return; }
    const ok = await initFirebase();
    if (!ok) { $("#app").innerHTML = renderConfigWarning(); return; }
    const savedCode = localStorage.getItem("taphouse_barCode");
    if (savedCode) {
      State.barCode = savedCode;
      try {
        const snap = await getDoc(doc(State.db, "bars", savedCode));
        if (snap.exists()) { subscribeBar(); return; }
        else { localStorage.removeItem("taphouse_barCode"); State.barCode = null; }
      } catch (e) { console.warn("Couldn't resume saved bar:", e); }
    }
    render();
  })();
</script>

</body>
</html>
